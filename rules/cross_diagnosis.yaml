# ==============================================================================
# ECUScope — Перекрёстный диагноз (кросс-анализ всех систем по тегам)
# Декларативный формат (type: cross_diagnosis), без Python-скриптов.
# ==============================================================================

sections:
  - id: cross_diagnosis_section
    title: "Сводный перекрёстный диагноз"
    order: 90
    checks:
      - id: cross_diagnosis
        title: "Перекрёстный диагноз"
        type: cross_diagnosis
        if_clean:
          badge: "НОРМА"
          val: "Противоречий нет"
          norm: "Все связки датчиков и систем согласованы"
          tip: "Кросс-анализ всех проверок не выявил системных противоречий между смесеобразованием, воздухом, охлаждением и зажиганием."
        diagnoses:
          - id: bad_sensor_ground
            status: bad
            title: "Плохая масса датчиков / питание ЭБУ"
            any_tags: ["bad_ground", "adc_glitch"]
            norm: "Синхронные скачки АЦП при просадке напряжения"
            tip: "Зафиксированы синхронные скачки показаний датчиков при просадке напряжения бортсети — проверьте обжимку масс жгута ЭБУ и клеммы АКБ."

          - id: ckp_signal_loss
            status: bad
            title: "Нестабильный сигнал ДПКВ"
            any_tags: ["ckp_dropout", "engine_stall"]
            norm: "Мгновенные срывы оборотов в 0 на ходу"
            tip: "Обнаружены срывы сигнала оборотов — проверьте разъём, проводку ДПКВ, зазор и биение задающего диска."

          - id: clutch_switch_or_dfco
            status: bad
            title: "Подброс при переключении (концевик сцепления / ПХХ)"
            any_tags: ["shift_flare"]
            norm: "Удержание РХХ и топлива при закрытии дросселя"
            tip: "При сбросе газа и выжиме сцепления ЭБУ удерживает РХХ открытым (>85 шаг) без отсечки ПХХ — проверьте концевик педали сцепления и калибровки демпфера РХХ."

          - id: intake_air_leak
            status: bad
            title: "Подсос воздуха за дросселем"
            all_tags: ["air_leak", "lean_mix"]
            norm: "Зажатый РХХ + обеднение смеси на ХХ"
            tip: "Совпали признаки неучтённого воздуха по РХХ и обеднение смеси на ХХ с выравниванием на оборотах — проверьте впускной тракт, шланги ВУТ/адсорбера и уплотнения форсунок."

          - id: maf_degradation
            status: warn
            title: "Деградация / загрязнение ДМРВ"
            all_tags: ["maf_issue"]
            any_tags: ["lean_mix", "rich_mix", "throttle_lag", "high_maf"]
            norm: "Сдвиг АЦП покоя или слабое приращение расхода"
            tip: "Отклонения АЦП покоя или отклика ДМРВ сопровождаются сдвигом топливных коррекций или провалом при резком газе."

          - id: fuel_supply_deficit
            status: warn
            title: "Дефицит топливоподачи"
            any_tags: ["fuel_deficit", "lean_load", "injector_overload"]
            none_tags: ["air_leak", "maf_issue"]
            norm: "Бедная смесь / высокая загрузка форсунок под нагрузкой"
            tip: "Обеднение смеси под нагрузкой при исправном воздушном тракте указывает на снижение давления топлива (бензонасос, фильтр, РДТ) или загрязнение форсунок."

          - id: iac_hang_in_motion
            status: warn
            title: "Подвисание РХХ / нет отсечки ПХХ"
            any_tags: ["iac_hang", "no_dfco"]
            norm: "Высокий шаг РХХ или подача топлива при торможении двигателем"
            tip: "При закрытом дросселе на ходу не включается отсечка ПХХ или завышен шаг РХХ — проверьте регулировку нуля ДПДЗ, концевик сцепления и чистоту канала РХХ."

          - id: iac_throttle_dirty
            status: warn
            title: "Неисправность РХХ / дроссельного узла"
            any_tags: ["iac_stuck", "iac_dirty", "idle_hunting", "rpm_dip", "tps_zero_shift", "tps_noise"]
            norm: "Отклонения регулирования холостого хода и ДПДЗ"
            tip: "Выявлены провалы оборотов при сбросе газа, повышенный шаг РХХ или сдвиг нуля/шум дорожек ДПДЗ — очистите дроссельный узел и проверьте РХХ и ДПДЗ."

          - id: throttle_cascade_lag
            status: warn
            title: "Задержка отклика при резком газе"
            any_tags: ["throttle_lag"]
            none_tags: ["maf_issue"]
            norm: "Замедленная реакция ДПДЗ -> ДМРВ -> впрыск -> обороты"
            tip: "Нарушена каскадная реакция при резком открытии дросселя — проверьте ДПДЗ, ДМРВ, свечи и давление в топливной рампе."

          - id: ignition_misfires
            status: bad
            title: "Пропуски воспламенения"
            any_tags: ["misfires"]
            norm: "Зафиксированы пропуски зажигания по цилиндрам"
            tip: "Обнаружены пропуски воспламенения — проверьте свечи, индивидуальные катушки/модуль зажигания, компрессию и форсунки проблемного цилиндра."

          - id: load_knock_retard
            status: warn
            title: "Детонация под нагрузкой"
            any_tags: ["knock"]
            norm: "Глубокий отскок УОЗ при разгоне"
            tip: "Зафиксирован отскок УОЗ по детонации — проверьте октановое число топлива, температуру воздуха на впуске и состояние камеры сгорания."

          - id: o2_lambda_fault
            status: warn
            title: "Сбой лямбда-регулирования (ДК1)"
            any_tags: ["o2_stuck", "o2_slow", "o2_heater", "no_closed_loop"]
            norm: "Медленный отклик или отсутствие замкнутого цикла ДК1"
            tip: "Медленное переключение ДК1 или срыв Closed Loop искажает топливные коррекции и повышает расход топлива."

          - id: cooling_system_fault
            status: warn
            title: "Неисправность системы охлаждения / термостата"
            any_tags: ["overheat", "thermostat_cold", "ect_stuck", "temp_sensor_drift"]
            norm: "Отклонение рабочей температуры ОЖ или расхождение ДТОЖ/ДТВ"
            tip: "Проверьте работу термостата, вентилятора охлаждения и показания ДТОЖ на холодном двигателе."

          - id: purge_valve_fault
            status: warn
            title: "Неисправность клапана продувки адсорбера (КПА)"
            any_tags: ["cold_purge", "purge_rich", "purge_hunting"]
            norm: "Подсос паров топлива или ранняя продувка на холодную"
            tip: "Проверьте герметичность клапана продувки адсорбера (КПА) в закрытом состоянии."

          - id: catalyst_aging
            status: warn
            title: "Снижение эффективности катализатора"
            any_tags: ["cat_bad", "cat_warn"]
            norm: "Повышенная амплитуда сигнала ДК2 после нейтрализатора"
            tip: "Сигнал ДК2 повторяет колебания первого датчика — снижена кислородная ёмкость катализатора либо есть подсос воздуха в выпуск до ДК2."
